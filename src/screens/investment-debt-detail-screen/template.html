<section class="investment-detail editorial-theme">
  <header class="investment-detail__intro">
    <div><h1 id="debt-detail-title">Debt account</h1><p id="debt-detail-subtitle">Viewing summary</p></div>
    <button class="editorial-button" id="edit-debt-account" type="button">Edit debt</button>
  </header>
  <section class="editorial-section" aria-labelledby="debt-history-title">
    <header class="editorial-section-header"><h2 id="debt-history-title" class="type-section-title">Month by month</h2></header>
    <div class="investment-detail__table-wrap" id="debt-history-wrap"><table class="investment-detail__table">
      <thead><tr><th>Month</th><th class="is-number">Payments</th><th class="is-number">New borrowing</th><th class="is-number">Balance</th></tr></thead>
      <tbody id="debt-history-body"></tbody><tfoot id="debt-history-footer"></tfoot>
    </table></div>
    <p id="debt-history-empty" class="investment-detail__empty" hidden>No monthly balances have been recorded for this year.</p>
  </section>
</section>
