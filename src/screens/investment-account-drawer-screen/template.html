<drawer-overlay
  id="investment-account-drawer-backdrop"
  title="Add account"
  hidden
  tabs='[{"key":"investment","title":"Investments","isDefaultValue":true},{"key":"debt","title":"Debt"}]'
>
  <form id="investment-account-edit-form" class="edit-form">
    <div class="drawer-form-grid">
      <label class="form-field transaction-field--wide">
        <span class="form-field-label">Name</span>
        <input id="investment-account-name-input" name="name" required />
      </label>

      <div class="form-field transaction-field--wide">
        <source-select
          class="form-field transaction-field--wide"
          label="Default source"
        ></source-select>
      </div>

      <div id="debt-account-fields" hidden>
        <category-select
          id="debt-account-category"
          label="Expense category"
          data-info="Debt payments get automatically assigned as an expense in this category."
        ></category-select>
        <label class="form-field">
          <span class="drawer-field-label">
            <span class="form-field-label">Interest rate</span>
            <info-hover
              data-info="Track the interest rate on your debt to prioritize debt payoff."
            >
            </info-hover>
          </span>
          <span class="percentage-field">
            <input
              id="investment-account-percentage-input"
              name="interestRate"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
            />
            <span aria-hidden="true">%</span></span
          >
        </label>
      </div>
      <div class="drawer-assignment-field transaction-field--wide">
        <span class="drawer-field-label">
          <span class="form-field-label">Assignment</span>
          <info-hover
            data-info="You can set ownership of this account to a single person or make it a shared account."
          >
          </info-hover>
        </span>
        <people-select label="Default assignment"></people-select>
      </div>
    </div>
    <p class="form-message" role="status"></p>
    <div class="drawer-controls">
      <footer class="drawer-actions">
        <custom-button
          class="destructive-action"
          type="button"
          label="Archive account"
          leading-icon="box"
          data-account-archive
          hidden
        ></custom-button>
        <custom-button
          class="primary-button"
          type="submit"
          label="Save changes"
        ></custom-button>
      </footer>
    </div>
  </form>
</drawer-overlay>
