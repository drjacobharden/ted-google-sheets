<div class="year-selector__scope" aria-label="Year">
  <custom-button
    class="year-selector__year-step square tertiary"
    data-year-step="previous"
    leading-icon="chevronLeft"
    aria-label="Previous year"
  ></custom-button>
  <div class="vertical-divider" aria-hidden="true"></div>
  <dropdown-menu
    class="year-selector__dropdown"
    variant="editorial"
    aria-label="Year"
    hide-trailing-chevron
    align-center
  ></dropdown-menu>
  <div class="vertical-divider" aria-hidden="true"></div>
  <custom-button
    class="year-selector__year-step square tertiary"
    data-year-step="next"
    leading-icon="chevronRight"
    aria-label="Next year"
  ></custom-button>
</div>
