<drawer-overlay
  id="investment-month-drawer-backdrop"
  title="New ledger entry"
  tabs='[{"key":"investment","title":"Investment","isDefaultValue":true},{"key":"debt","title":"Debt"}]'
  hidden
>
  <form id="investment-month-form" class="investment-month-form" novalidate>
    <div class="investment-month-targets drawer-form-grid">
      <account-select id="investment-month-account" account-type="investment" label="Investment account"></account-select>
      <month-picker label="Month and year" alignment="center"></month-picker>
    </div>
    <currency-input
      class="investment-month-balance"
      name="balance"
      label="Ending balance"
      min="0"
      required
    ></currency-input>
    <div id="investment-month-investment-fields">
      <section
        class="investment-flow-section"
        aria-labelledby="investment-contributions-title"
      >
        <div class="investment-flow-section__heading">
          <div>
            <h3 id="investment-contributions-title">Contributions</h3>
            <p>Date optional · defaults to the 15th</p>
          </div>
          <custom-button
            id="add-investment-contribution"
            class="tertiary square"
            leading-icon="plus"
            aria-label="Add contribution"
            type="button"
          ></custom-button>
        </div>
        <div
          class="investment-flow-list"
          id="investment-contribution-list"
        ></div>
      </section>
      <section
        class="investment-flow-section"
        aria-labelledby="investment-withdrawals-title"
      >
        <div class="investment-flow-section__heading">
          <div>
            <h3 id="investment-withdrawals-title">Withdrawals</h3>
            <p>Date optional · defaults to the 15th</p>
          </div>
          <custom-button
            id="add-investment-withdrawal"
            class="tertiary square"
            leading-icon="plus"
            aria-label="Add withdrawal"
            type="button"
          ></custom-button>
        </div>
        <div class="investment-flow-list" id="investment-withdrawal-list"></div>
      </section>
    </div>
    <div id="investment-month-debt-fields" hidden>
      <section
        class="investment-flow-section"
        aria-labelledby="debt-payments-title"
      >
        <div class="investment-flow-section__heading">
          <div>
            <h3 id="debt-payments-title">Payments</h3>
            <p>Date optional · defaults to the 15th</p>
          </div>
          <custom-button
            id="add-debt-payment"
            class="tertiary square"
            leading-icon="plus"
            aria-label="Add debt payment"
            type="button"
          ></custom-button>
        </div>
        <div class="investment-flow-list" id="debt-payment-list"></div>
      </section>
      <section
        class="investment-flow-section"
        aria-labelledby="debt-borrowing-title"
      >
        <div class="investment-flow-section__heading">
          <div>
            <h3 id="debt-borrowing-title">New borrowing</h3>
            <p>Date optional · defaults to the 15th</p>
          </div>
          <custom-button
            id="add-debt-borrowing"
            class="tertiary square"
            leading-icon="plus"
            aria-label="Add new borrowing"
            type="button"
          ></custom-button>
        </div>
        <div class="investment-flow-list" id="debt-borrowing-list"></div>
      </section>
    </div>
    <p class="form-message" id="investment-month-message" role="status"></p>
    <div class="drawer-controls">
      <footer class="drawer-actions">
        <custom-button
          class="primary-button"
          type="submit"
          label="Add entry"
        ></custom-button>
      </footer>
      <label class="batch-entry-toggle" id="investment-batch-toggle"
        ><span
          ><strong>Batch input</strong
          ><small>Keep this month and add another account</small></span
        ><input type="checkbox" name="batchEntry" role="switch"
      /></label>
      <div class="metadata" id="investment-balance-metadata" hidden>
        <p>
          <strong class="text-90">Balance ID: </strong
          ><code class="text-90" id="investment-balance-id"></code>
        </p>
      </div>
    </div>
  </form>
</drawer-overlay>
