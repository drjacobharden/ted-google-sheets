<breadcrumbs-header>
  <refresh-button></refresh-button>
  <custom-button
    class="primary-button"
    id="new-category-button"
    leading-icon="plus"
    label="Add category"
    data-action="new-category"
  ></custom-button>
</breadcrumbs-header>

<div class="table-action-row">
  <custom-button
    class="ghost-button table-view-button"
    label="Expenses"
    data-table-view="expense"
  >
  </custom-button>
  <custom-button
    class="ghost-button table-view-button"
    label="Income"
    data-table-view="income"
  >
  </custom-button>
  <custom-button
    class="ghost-button table-view-button"
    label="Archived"
    data-table-view="archived"
  >
  </custom-button>

  <custom-button
    class="secondary-button push-right"
    label="Sort"
    leading-icon="sort"
  ></custom-button>
  <custom-button
    class="secondary-button"
    label="Filter"
    leading-icon="filter"
  ></custom-button>
</div>

<div class="content category-screen__content">
  <div class="category-screen__layout">
    <section
      class="category-screen__panel"
      aria-labelledby="category-list-title"
    >
      <div class="category-screen_list-header">
        <span class="col 2">Name</span>
        <span class="col 3">Transaction count</span>
        <span class="col 4">Total</span>
      </div>
      <div
        class="category-screen__list"
        id="category-list"
        aria-live="polite"
      ></div>
    </section>
