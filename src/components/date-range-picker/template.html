<custom-button
  class="secondary-button square"
  data-range-step="week"
  label="W"
></custom-button>
<custom-button
  class="secondary-button square"
  data-range-step="month"
  label="M"
></custom-button>
<custom-button
  class="secondary-button square"
  data-range-step="year"
  label="Y"
></custom-button>
<div class="range-control">
  <custom-button
    class="secondary-button square control-left"
    data-date-action="prev"
    leading-icon="chevronLeft"
  ></custom-button>
  <custom-button
    class="secondary-button control-display"
    label="2026"
  ></custom-button>
  <custom-button
    class="secondary-button square control-right"
    data-date-action="next"
    leading-icon="chevronRight"
  ></custom-button>
</div>
