<div class="inner-nav">
  <div class="top-nav__brand" aria-label="TED home">
    <span>TED</span><i aria-hidden="true">.</i>
  </div>

  <nav
    id="top-primary-navigation-wrapper"
    class="top-nav__navigation"
    aria-label="Primary navigation"
  >
    <segmented-control
      id="top-primary-navigation"
      variant="section-tabs"
      aria-label="Primary navigation"
    ></segmented-control>
  </nav>

  <div class="top-nav__actions">
    <custom-button
      class="top-nav__icon-button primary-button"
      leading-icon="plus"
      data-action="new-transaction"
      aria-label="Add transaction"
      label="New entry"
    ></custom-button>
    <custom-button
      id="top-mobile-menu-toggle"
      class="top-nav__mobile-toggle tertiary square"
      leading-icon="menu"
      data-action="open-mobile-navigation"
      aria-label="Open navigation"
      aria-controls="top-mobile-navigation"
      aria-expanded="false"
      tabindex="0"
    ></custom-button>
  </div>
</div>

<div
  class="top-nav__mobile-scrim"
  data-action="close-mobile-navigation"
  aria-hidden="true"
></div>
<aside
  id="top-mobile-navigation"
  class="top-nav__mobile-panel"
  role="dialog"
  aria-modal="true"
  aria-label="Navigation"
  aria-hidden="true"
  inert
>
  <header class="top-nav__mobile-panel-header">
    <span>Menu</span>
    <custom-button
      class="ghost-button square"
      leading-icon="close"
      data-action="close-mobile-navigation"
      aria-label="Close navigation"
      tabindex="0"
    ></custom-button>
  </header>

  <nav class="top-nav__mobile-navigation" aria-label="Mobile navigation">
    <section class="top-nav__mobile-section" data-mobile-section="budgeting">
      <h2>Budgeting</h2>
      <button
        type="button"
        data-mobile-route="budget-overview"
        data-content-key="overview"
      >
        Overview
      </button>
      <button
        type="button"
        data-mobile-route="transactions"
        data-content-key="transactions"
      >
        Transactions
      </button>
      <button
        type="button"
        data-mobile-route="categories"
        data-content-key="categories"
      >
        Categories
      </button>
      <button
        type="button"
        data-mobile-route="vendors"
        data-content-key="vendors"
      >
        Vendors
      </button>
      <button
        type="button"
        data-mobile-route="people"
        data-content-key="people"
      >
        Assignments
      </button>
    </section>

    <section class="top-nav__mobile-section" data-mobile-section="investments">
      <h2>Investments</h2>
      <button type="button" data-mobile-route="investment-overview">
        Overview
      </button>
      <button type="button" data-mobile-route="investment-accounts">
        Accounts
      </button>
    </section>

    <section class="top-nav__mobile-section" data-mobile-section="goals">
      <h2>Goals</h2>
      <button type="button" data-mobile-route="dashboard">Overview</button>
    </section>

  <footer class="top-nav__mobile-footer">
    <button type="button" data-mobile-route="settings">Settings</button>
  </footer>
</aside>
