<section class="entity-ledger editorial-theme" data-screen="vendors">
  <header class="tab-header">
    <div class="tab-header-title">
      <h1>Vendors</h1>
      <p id="vendor-ledger-subtitle">Viewing vendor totals</p>
    </div>
    <div class="entity-ledger__tools" aria-label="Vendor list controls">
      <dropdown-menu
        id="vendor-month-selector"
        variant="editorial"
        label="All months"
        aria-label="Select vendor month"
      ></dropdown-menu>
      <search-bar
        id="vendor-search"
        variant="editorial"
        placeholder="search by name"
        aria-label="Search vendors by name"
      ></search-bar>
      <filter-bar id="vendor-ledger-filter" variant="editorial"></filter-bar>
    </div>
  </header>
  <table-list aria-label="Vendors"></table-list>
</section>
