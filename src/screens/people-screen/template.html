<section class="entity-ledger editorial-theme" data-screen="people">
  <header class="tab-header">
    <div class="tab-header-title">
      <h1>People</h1>
      <p id="people-ledger-subtitle">Viewing balances per person</p>
    </div>
    <div class="tab-header-tools" aria-label="People list controls">
      <dropdown-menu
        id="people-month-selector"
        variant="editorial"
        label="All months"
        aria-label="Select people month"
      ></dropdown-menu>
      <search-bar
        id="people-search"
        variant="editorial"
        placeholder="search by name"
        aria-label="Search people by name"
      ></search-bar>
      <filter-bar id="people-ledger-filter" variant="editorial"></filter-bar>
    </div>
  </header>
  <table-list aria-label="People"></table-list>
</section>
