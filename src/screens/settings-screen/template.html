<main
  class="settings-screen__page editorial-theme"
  aria-labelledby="settings-title"
>
  <header class="tab-header settings-screen__masthead">
    <div class="tab-header-title">
      <h1 id="new-transaction-title">Settings</h1>
    </div>
  </header>

  <div class="settings-screen__ledger">
    <section
      class="settings-screen__section"
      aria-labelledby="settings-profile-title"
    >
      <header class="settings-screen__section-heading">
        <h2 id="settings-profile-title" class="type-section-title">
          Your name <span class="type-meta">— fig. 01</span>
        </h2>
        <p class="type-caption">
          The name attached to your activity in the ledger.
        </p>
      </header>
      <user-form></user-form>
    </section>

    <section
      class="settings-screen__section"
      aria-labelledby="settings-sheet-title"
    >
      <header class="settings-screen__section-heading">
        <h2 id="settings-sheet-title" class="type-section-title">
          Google Sheet <span class="type-meta">— fig. 02</span>
        </h2>
        <p class="type-caption">
          The deployed Apps Script URL used to read and write your budget.
        </p>
      </header>
      <url-form></url-form>
    </section>
  </div>
</main>
