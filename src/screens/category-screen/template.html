<section class="entity-ledger editorial-theme" data-screen="categories">
  <header class="tab-header">
    <div class="tab-header-title">
      <div class="tab-header-title__row">
        <h1>Categories</h1>
        <custom-button class="tertiary circle" leading-icon="plus" data-header-action="new-category" aria-label="Add category"></custom-button>
      </div>
      <p id="category-ledger-subtitle">Spend by category</p>
    </div>
    <div class="tab-header-tools" aria-label="Category list controls">
      <dropdown-menu
        id="category-type-selector"
        variant="editorial"
        label="Expense"
        aria-label="Select category type"
      ></dropdown-menu>
      <dropdown-menu
        id="category-month-selector"
        variant="editorial"
        label="All months"
        aria-label="Select category month"
      ></dropdown-menu>
      <search-bar
        id="category-search"
        variant="editorial"
        placeholder="search"
        aria-label="Search categories by name"
      ></search-bar>
      <filter-bar id="category-ledger-filter" variant="editorial"></filter-bar>
    </div>
  </header>
  <data-table sortable interactive aria-label="Categories"></data-table>
</section>
