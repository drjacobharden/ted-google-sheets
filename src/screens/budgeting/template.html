<header class="budgeting-header__utility-row">
  <div class="budgeting-header__scope" aria-label="Budgeting scope">
    <custom-button
      id="budgeting-year-previous"
      class="budgeting-header__year-step square tertiary"
      data-year-step="previous"
      leading-icon="chevronLeft"
      aria-label="Previous year"
    ></custom-button>
    <dropdown-menu
      id="budgeting-year-selector"
      variant="editorial"
      aria-label="Budget year"
    ></dropdown-menu>
    <custom-button
      id="budgeting-year-next"
      class="budgeting-header__year-step square tertiary"
      data-year-step="next"
      leading-icon="chevronRight"
      aria-label="Next year"
    ></custom-button>
  </div>
  <div id="budgeting-header-actions" class="budgeting-header__actions"></div>
</header>

<nav class="budgeting-header__sections" aria-label="Budgeting screens">
  <segmented-control
    id="budgeting-section-selector"
    variant="section-tabs"
    aria-label="Budgeting screen"
  ></segmented-control>
</nav>
