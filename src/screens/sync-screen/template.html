<page-title eyebrow="Background activity" title="Sync" subtitle="Review changes waiting to be saved to your Google Sheet."></page-title>
<div class="sync-screen__card">
  <div class="table-header">
    <div><h2>Changes</h2><p id="sync-screen-summary">All changes are saved.</p></div>
    <button class="secondary-button compact" id="retry-all-sync" type="button" hidden>Retry all now</button>
  </div>
  <div class="sync-screen__empty" id="sync-empty"><div class="empty-symbol" aria-hidden="true">✓</div><h3>Everything is up to date</h3><p>New changes will appear here while they are syncing.</p></div>
  <div class="sync-screen__list" id="sync-list" aria-live="polite"></div>
</div>
