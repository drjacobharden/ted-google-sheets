<div
  class="app-refresh-indicator"
  id="app-refresh-indicator"
  role="status"
  aria-live="polite"
  hidden
>
  <custom-button
    id="app-refresh-dismiss"
    class="ghost-button circle"
    leading-icon="close"
    aria-label="Dismiss refresh error"
    hidden
  ></custom-button>
  <span class="spinner compact-spinner" aria-hidden="true"></span>
  <span id="app-refresh-text">Refreshing data</span>
  <button id="app-refresh-retry" type="button" hidden>Try again</button>
</div>
