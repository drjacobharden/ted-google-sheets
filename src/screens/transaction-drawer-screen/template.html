<drawer-overlay
  id="transaction-drawer-backdrop"
  title="Edit transaction"
  hidden
>
  <form id="transaction-edit-form" class="edit-form" novalidate>
    <input type="hidden" name="type" value="expense" />
    <div class="transaction-amount-editor">
      <currency-input
        id="transaction-drawer-amount"
        min="0.01"
      ></currency-input>
    </div>
    <div class="transaction-detail-list">
      <date-picker
        name="date"
      ></date-picker>
      <div class="transaction-detail-row transaction-payment-type">
        <span class="transaction-detail-label">Payment Type</span>
        <payment-type-select
          id="transaction-payment-type"
          kind="expense"
          value="positive"
        ></payment-type-select>
      </div>
      <category-select></category-select>
      <vendor-select></vendor-select>
      <people-select></people-select>
      <account-select
        id="transaction-account"
        label="Account"
        account-type="all"
      ></account-select>
      <source-select
        id="transaction-source"
      ></source-select>
      <label
        class="form-field transaction-note"
      >
        <span>Description<small>(optional)</small></span>
        <input
          name="notes"
          type="text"
          maxlength="500"
          placeholder="enter note..."
        />
      </label>
    </div>
    <p
      class="form-message"
      id="transaction-edit-message"
      aria-live="polite"
    ></p>
    <div class="drawer-controls">
      <footer class="drawer-actions">
        <custom-button
          class="destructive-action"
          id="delete-transaction"
          type="button"
          label="Delete transaction"
          leading-icon="trash"
        ></custom-button>
        <custom-button
          label="Save changes"
          class="primary-button"
          type="submit"
        ></custom-button>
      </footer>
    </div>
    <div class="metadata">
      <p>
        <strong class="text-90">Transaction ID: </strong>
        <code class="text-90" id="transaction-edit-id"></code>
      </p>
      <p class="text-80 muted" id="transaction-created-footnote"></p>
    </div>
  </form>
</drawer-overlay>
