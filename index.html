<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private, local-first budget tracker connected to Google Sheets."
    />
    <title hidden>TED</title>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/variables.css" />
    <link rel="stylesheet" href="theme/elements.css" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/branding.css" />
    <link rel="stylesheet" href="css/navigation-bar.css" />
    <link rel="stylesheet" href="css/responsiveness.css" />
    <link rel="stylesheet" href="dist/bundle.css?v=24" />

    <script src="dist/bundle.js?v=24"></script>
  </head>
  <body>
    <overlay-manager></overlay-manager>
    <main class="app-shell">
      <!-- <navigation-bar></navigation-bar> -->
      <top-nav class="nav"></top-nav>
      <budgeting-header></budgeting-header>
      <investments-header></investments-header>
      <div id="route-outlet"></div>
      <!-- Dashboard tab -->
      <template id="route-dashboard">
        <dashboard-screen></dashboard-screen>
      </template>
      <!-- Budgeting screens -->
      <template id="route-budget-overview">
        <budget-overview-screen></budget-overview-screen>
      </template>
      <template id="route-transactions">
        <transaction-list-screen></transaction-list-screen>
      </template>
      <template id="route-new-transaction">
        <new-transaction-screen></new-transaction-screen>
      </template>
      <template id="route-categories">
        <category-screen></category-screen>
      </template>
      <template id="route-vendors">
        <vendors-screen></vendors-screen>
      </template>
      <template id="route-people">
        <people-screen></people-screen>
      </template>
      <template id="route-entity-detail">
        <entity-detail-screen></entity-detail-screen>
      </template>
      <template id="route-entity-archive">
        <entity-archive-screen></entity-archive-screen>
      </template>
      <!-- Import tab -->
      <template id="route-import">
        <import-screen></import-screen>
      </template>
      <!-- Sync tab -->
      <template id="route-sync">
        <sync-screen></sync-screen>
      </template>
      <!-- Settings tab -->
      <template id="route-settings">
        <settings-screen></settings-screen>
      </template>
      <!-- Investment overview tab -->
      <template id="route-investment-overview">
        <investment-overview-screen></investment-overview-screen>
      </template>
      <!-- Investment accounts tab -->
      <template id="route-investment-accounts">
        <investment-accounts-screen></investment-accounts-screen>
      </template>
      <!-- Investment debts tab -->
      <template id="route-investment-debts">
        <investment-debts-screen></investment-debts-screen>
      </template>
      <template id="route-investment-ledger">
        <investment-ledger-screen></investment-ledger-screen>
      </template>
      <!-- Investment account detail -->
      <template id="route-investment-account-detail">
        <investment-account-detail-screen></investment-account-detail-screen>
      </template>
      <template id="route-investment-debt-detail">
        <investment-debt-detail-screen></investment-debt-detail-screen>
      </template>
    </main>
  </body>
</html>
