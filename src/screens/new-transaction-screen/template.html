<section
  class="new-transaction-page editorial-theme"
  aria-labelledby="new-transaction-title"
>
  <header class="tab-header">
    <div class="tab-header-title">
      <h1 id="new-transaction-title">New transaction</h1>
    </div>
  </header>

  <nav
    class="budgeting-header__sections new-transaction-page__kind-nav"
    aria-label="Transaction input actions"
  >
    <segmented-control
      id="new-transaction-kind"
      variant="section-tabs"
      aria-label="Entry section"
    ></segmented-control>
    <custom-button
      class="ghost-button new-transaction-page__import-button"
      leading-icon="import"
      data-action="open-import"
      label="Bulk import"
      type="button"
    ></custom-button>
  </nav>

  <form id="new-transaction-form" novalidate>
    <input type="hidden" name="type" value="expense" />
    <div class="new-transaction-page__grid">
      <div class="new-transaction-page__entry-column">
        <date-picker
          id="new-transaction-date-inline"
          class="new-transaction-page__calendar new-transaction-page__date--inline"
          variant="inline"
        ></date-picker>
        <section class="new-transaction-page__batch-list" hidden aria-label="Batch entries">
          <h2>Choose a date and amount</h2>
          <div class="new-transaction-page__batch-cards"></div>
          <custom-button
            class="ghost-button new-transaction-page__add-entry"
            leading-icon="plus"
            data-action="add-batch-entry"
            label="Add another entry"
            type="button"
          ></custom-button>
          <p class="new-transaction-page__batch-notice" role="status" hidden></p>
        </section>
      </div>

      <div class="new-transaction-page__fields">
        <div class="new-transaction-page__amount-editor">
          <currency-input
            id="new-transaction-amount"
            min="0.01"
          ></currency-input>
        </div>

        <p class="new-transaction-page__batch-section-title" hidden>
          Add transaction details
        </p>

        <div class="new-transaction-page__detail-list">
          <date-picker
            id="new-transaction-date-compact"
            class="new-transaction-page__date--compact"
            name="date"
            alignment="right"
          ></date-picker>
          <div
            class="new-transaction-page__detail-row new-transaction-page__payment-type"
          >
            <span class="new-transaction-page__detail-label">Payment Type</span>
            <payment-type-select
              id="new-transaction-payment-type"
              kind="expense"
              value="positive"
            ></payment-type-select>
          </div>
          <category-select type="all" create-type="expense"></category-select>
          <vendor-select></vendor-select>
          <people-select></people-select>
          <account-select
            id="new-transaction-account"
            label="Account"
            account-type="all"
            create-via-drawer
            hidden
          ></account-select>
          <source-select id="new-transaction-source"></source-select>
          <label class="form-field new-transaction-page__notes">
            <span>Description<small>(optional)</small></span>
            <input
              id="new-transaction_notes"
              name="notes"
              type="text"
              maxlength="500"
              placeholder="enter note..."
            />
          </label>
        </div>

        <div class="new-transaction-page__footer">
          <p
            id="new-transaction-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <div class="new-transaction-page__footer-actions">
            <label class="new-transaction-page__batch-toggle" for="new-transaction-batch-toggle">
              <input id="new-transaction-batch-toggle" type="checkbox" role="switch" />
              <span>Batch entry</span>
            </label>
            <custom-button
              class="primary-button"
              data-action="submit-transaction"
              type="submit"
              label="Add transaction"
            ></custom-button>
          </div>
        </div>
      </div>
    </div>
  </form>
</section>
