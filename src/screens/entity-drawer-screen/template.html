<drawer-overlay id="entity-drawer-backdrop" title="Edit entity" hidden>
  <form id="entity-edit-form" class="entity-edit-form" novalidate>
    <div class="drawer-form-grid">
      <label class="form-field entity-field entity-field--wide">
        <span id="entity-name-label">Name</span>
        <input
          name="name"
          type="text"
          maxlength="80"
          autocomplete="off"
          required
        />
      </label>
    </div>

    <p class="form-message" aria-live="polite"></p>

    <div id="entity-category-type-field" hidden>
      <span class="entity-field-label">Category type</span>
      <dropdown-menu
        id="entity-category-type-selector"
        variant="editorial"
        label="Expense"
        align-center
        aria-label="Select category type"
      ></dropdown-menu>
    </div>

    <div class="entity-drawer-controls">
      <footer class="drawer-actions">
        <custom-button
          class="destructive-action"
          id="archive-entity"
          type="button"
          label="Archive entity"
          leading-icon="box"
          hidden
        ></custom-button>
        <custom-button
          class="primary-button"
          id="save-entity"
          type="submit"
          label="Save changes"
        ></custom-button>
      </footer>
    </div>
  </form>

  <div class="metadata" id="entity-metadata" hidden>
    <p>
      <strong class="text-90">Entity ID: </strong>
      <code class="text-90" id="entity-edit-id"></code>
    </p>
    <p class="text-80 muted" id="entity-created-footnote"></p>
  </div>
</drawer-overlay>
