<article class="investment-account-detail editorial-theme">
  <header class="tab-header">
    <div class="tab-header-title">
      <div class="tab-header-title__row">
        <h1 id="investment-detail-title">Investment account</h1>
        <custom-button class="tertiary circle" leading-icon="pencil" data-edit-investment-account aria-label="Edit account"></custom-button>
      </div>
      <p id="investment-detail-subtitle">Viewing summary</p>
    </div>
  </header>

  <dl class="investment-account-detail__summary" aria-label="Account summary">
    <div>
      <dt>
        <span>Balance</span>
        <custom-icon
          icon="info"
          data-summary-help="balance"
          tabindex="0"
          aria-label="About balance"
        ></custom-icon>
      </dt>
      <dd id="investment-detail-summary-balance">—</dd>
    </div>
    <div>
      <dt>
        <span>Contributions</span>
        <custom-icon
          icon="info"
          data-summary-help="contributions"
          tabindex="0"
          aria-label="About contributions"
        ></custom-icon>
      </dt>
      <dd id="investment-detail-summary-contributions">—</dd>
    </div>
    <div>
      <dt>
        <span>Account growth</span>
        <custom-icon
          icon="info"
          data-summary-help="growth"
          tabindex="0"
          aria-label="About account growth"
        ></custom-icon>
      </dt>
      <dd id="investment-detail-summary-growth">—</dd>
    </div>
    <div>
      <dt>
        <span>ROI</span>
        <custom-icon
          icon="info"
          data-summary-help="roi"
          tabindex="0"
          aria-label="About ROI"
        ></custom-icon>
      </dt>
      <dd id="investment-detail-summary-roi">—</dd>
    </div>
  </dl>

  <section
    class="investment-account-detail__chart editorial-section"
    aria-labelledby="investment-detail-chart-title"
  >
    <header class="editorial-section-header">
      <h2 id="investment-detail-chart-title" class="type-section-title">
        Account performance <span class="type-meta">— fig. 01</span>
      </h2>
      <dropdown-menu
        id="investment-detail-chart-mode"
        variant="ghost"
        label="Balance"
        aria-label="Account chart display"
      ></dropdown-menu>
    </header>
    <div class="investment-account-detail__chart-frame editorial-surface">
      <data-chart
        id="investment-detail-chart"
        aria-label="Investment account monthly performance"
      ></data-chart>
    </div>
  </section>

  <section
    class="investment-account-detail__history editorial-section"
    aria-labelledby="investment-history-title"
  >
    <header class="investment-account-detail__history-header">
      <h2 id="investment-history-title" class="type-section-title">
        Monthly Balances
      </h2>
    </header>
    <data-table
      id="investment-account-history-table"
      sortable
      interactive
      aria-label="Investment account monthly history"
    ></data-table>
  </section>

  <section
    class="investment-account-detail__history editorial-section"
    aria-labelledby="investment-account-activity-title"
  >
    <header class="investment-account-detail__history-header">
      <h2 id="investment-account-activity-title" class="type-section-title">
        Account activity
      </h2>
      <div
        class="investment-account-detail__tools investment-account-detail__activity-tools"
        aria-label="Account activity controls"
      >
        <dropdown-menu
          id="investment-account-activity-month"
          variant="editorial"
          label="All months"
          aria-label="Filter account activity by month"
        ></dropdown-menu>
        <search-bar
          id="investment-account-activity-search"
          variant="editorial"
          placeholder="search"
          aria-label="Search account activity"
        ></search-bar>
        <filter-bar
          id="investment-account-activity-filter"
          variant="editorial"
        ></filter-bar>
      </div>
    </header>
    <data-table
      id="investment-account-activity-table"
      sortable
      interactive
      aria-label="Investment account activity"
    ></data-table>
  </section>
</article>
