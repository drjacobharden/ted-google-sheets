<span>Amount<small>(use a negative value for refunds)</small></span>
<div class="input-shell">
  <span class="text-90 pad-l-16 input-prefix">$</span>
  <input
    class="currency-field"
    name="amount"
    type="number"
    inputmode="decimal"
    step="0.01"
    placeholder="0.00"
    required
  />
</div>
