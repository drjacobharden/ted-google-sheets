<span>Amount</span>
<div class="input-shell">
  <custom-icon icon="dollarSign"></custom-icon>
  <input
    class="currency-field"
    name="amount"
    type="number"
    inputmode="decimal"
    step="0.01"
    placeholder="0.00"
    required
  />
</div>
<p class="currency-input__message" hidden></p>
