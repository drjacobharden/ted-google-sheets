<span>Amount<small>(use a negative value for refunds)</small></span>
<div class="input-shell">
  <custom-icon icon="dollarSign"></custom-icon>
  <input
    class="currency-field"
    name="amount"
    type="number"
    inputmode="decimal"
    step="0.01"
    placeholder="0.00"
    required
  />
</div>
