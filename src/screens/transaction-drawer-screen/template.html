<drawer-overlay
  id="transaction-drawer-backdrop"
  title="Edit transaction"
  tabs='[{"key":"expense","title":"Expense","isDefaultValue":true},{"key":"income","title":"Income"}]'
  hidden
>
  <form id="transaction-edit-form" class="edit-form" novalidate>
    <input type="hidden" name="type" value="expense" />
    <div class="drawer-form-grid">
      <currency-input
        class="transaction-field transaction-field--amount"
      ></currency-input>
      <date-picker
        class="transaction-field transaction-field--date"
        name="date"
      ></date-picker>
      <category-select class="transaction-field"></category-select>
      <vendor-input class="transaction-field"></vendor-input>
      <people-select
        class="transaction-field transaction-field--wide"
      ></people-select>
      <label
        class="form-field transaction-field transaction-field--wide transaction-note"
      >
        <span>Description<small>(optional)</small></span>
        <textarea name="notes" maxlength="500" rows="2"></textarea>
      </label>
    </div>
    <p
      class="form-message"
      id="transaction-edit-message"
      aria-live="polite"
    ></p>
    <div class="drawer-controls">
      <footer class="drawer-actions">
        <custom-button
          class="destructive-action"
          id="delete-transaction"
          type="button"
          label="Delete transaction"
          leading-icon="trash"
          hidden
        ></custom-button>
        <custom-button
          label="Save changes"
          class="primary-button"
          type="submit"
        ></custom-button>
      </footer>
      <label class="batch-entry-toggle" id="batch-entry-toggle">
        <span>
          <strong>Batch input</strong>
          <small>Create multiple entries without leaving</small>
        </span>
        <input type="checkbox" name="batchEntry" role="switch" />
      </label>
    </div>
    <div class="metadata">
      <p>
        <strong class="text-90">Transaction ID: </strong>
        <code class="text-90" id="transaction-edit-id"></code>
      </p>
      <p class="text-80 muted" id="transaction-created-footnote"></p>
    </div>
  </form>
</drawer-overlay>
