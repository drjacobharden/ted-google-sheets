<div
  class="overlay onboarding-overlay editorial-theme"
  id="onboarding-overlay"
  hidden
>
  <section
    class="onboarding-dialog"
    id="onboarding-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="onboarding-title"
    aria-describedby="onboarding-description"
    tabindex="-1"
  >
    <header class="onboarding-header">
      <div class="top-nav__brand" aria-label="TED home">
        <span>TED</span><i aria-hidden="true">.</i>
      </div>
      <p class="type-eyebrow">TED / Household ledger</p>
      <div class="onboarding-header-copy">
        <h1 id="onboarding-title" class="type-title">Set up your budget</h1>
        <p id="onboarding-description" class="type-caption">
          Connect this private ledger to a Google Sheet you control.
        </p>
      </div>
    </header>

    <ol
      class="onboarding-stepper"
      id="onboarding-stepper"
      aria-label="Setup progress"
      hidden
    ></ol>
    <main class="onboarding-content" id="onboarding-content"></main>
    <p
      class="onboarding-message"
      id="onboarding-message"
      role="status"
      aria-live="polite"
    ></p>
    <footer class="onboarding-actions" id="onboarding-actions" hidden>
      <button class="secondary-button" id="onboarding-back" type="button">
        Back
      </button>
      <button class="primary-button" id="onboarding-next" type="button">
        Continue
      </button>
    </footer>
  </section>
</div>
