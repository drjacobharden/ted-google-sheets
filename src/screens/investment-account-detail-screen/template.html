<page-title eyebrow="Investments" title="Investment account" subtitle="Monthly balance history">
  <button class="primary-button compact" id="edit-investment-account" type="button">Edit account</button>
</page-title>
<section class="ledger-card investment-account-detail-screen__card">
  <div class="table-header"><div><h2>Balance history</h2><p id="investment-account-history-count">0 balances</p></div></div>
  <div class="table-wrap" id="investment-account-history-wrap">
    <table class="investment-account-detail-screen__table">
      <thead><tr><th>Month</th><th>Net contribution</th><th class="amount-cell">Ending balance</th></tr></thead>
      <tbody id="investment-account-history-body"></tbody>
    </table>
  </div>
  <div id="investment-account-history-empty" class="investment-account-detail-screen__empty">No monthly balances have been recorded.</div>
</section>
