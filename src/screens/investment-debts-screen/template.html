<section class="entity-ledger editorial-theme" data-screen="investment-debts">
  <header class="tab-header">
    <div class="tab-header-title">
      <div class="tab-header-title__row">
        <h1>Debts</h1>
        <custom-button class="tertiary circle" leading-icon="plus" data-debt-account-new aria-label="Add debt account"></custom-button>
      </div>
      <p id="debt-ledger-subtitle">Debt account balances</p>
    </div>
    <div class="tab-header-tools" aria-label="Debt account list controls">
      <search-bar
        id="debt-search"
        variant="editorial"
        placeholder="search"
        aria-label="Search debt accounts by name"
      ></search-bar>
      <filter-bar id="debt-filter" variant="editorial"></filter-bar>
    </div>
  </header>
  <data-table sortable interactive aria-label="Debt accounts"></data-table>
</section>
