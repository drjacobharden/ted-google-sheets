<page-title eyebrow="Investments" title="Accounts" subtitle="Manage the investment accounts included in household reporting."></page-title>
<div class="investment-accounts-screen__layout">
  <section class="ledger-card investment-accounts-screen__list-card">
    <div class="table-header"><div><h2>Accounts</h2><p id="investment-account-count">0 accounts</p></div></div>
    <div id="investment-account-list" class="investment-accounts-screen__list"></div>
  </section>
  <form class="investment-accounts-screen__form" id="investment-account-form">
    <h2>Add an account</h2>
    <p>Create a record of the accounts you invest into.</p>
    <label class="form-field"><span>Name</span><input name="name" type="text" maxlength="80" placeholder="e.g. Roth IRA" required /></label>
    <label class="form-field"><span>Source</span><select name="source" required><option value="manual">Manual transfer</option><option value="paycheck">Paycheck deduction</option></select></label>
    <p class="investment-accounts-screen__footnote">Paycheck deductions are considered when calculating your total savings. Manual transfers are not because they come from savings already counted in income minus spending.</p>
    <button class="primary-button" type="submit">Add account</button>
    <p class="investment-accounts-screen__message" role="status"></p>
  </form>
</div>
